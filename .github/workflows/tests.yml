# 올릴 때마다 시험을 돌린다 (GitHub 의 Windows 러너에서 — 앱은 여전히 스스로 외부에 요청하지 않는다, 이것은 저장소의 일이다).
# - unit: pytest (단위·API, 규칙 시험, JS 형 점검) — 1~2분
# - screens: 화면 점검 (tools/ui_edges.py 전체와 tools/ui_smoke.py) — 30분쯤. master 에 올릴 때와 손으로 돌릴 때만
name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  unit:
    name: pytest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'   # 개발·빌드와 같은 판 (requirements 의 고정 버전이 이 판의 wheel 이다)
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'       # 규칙 시험(rules_check.mjs)과 형 점검(npx tsc)
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q -ra

  screens:
    name: screen checks
    if: github.event_name != 'pull_request'
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: ui_edges
        run: python tools/ui_edges.py
      - name: ui_smoke
        if: ${{ !cancelled() }}    # 가장자리 점검이 실패해도 회귀 점검의 결과를 본다
        run: python tools/ui_smoke.py
      - name: Keep screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots/
          if-no-files-found: ignore
          retention-days: 7
