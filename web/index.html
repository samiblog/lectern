<!doctype html>
<html lang="ko" data-ui="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lec-mode" content="{{MODE}}">
<meta name="lec-version" content="{{VERSION}}">
<meta name="lec-term" content="{{TERM}}"><!-- 터미널 API 의 비밀값 (실행마다 새로, terminal.js) -->
<title>Lectern</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link id="lec-hljs-css" rel="stylesheet" href="/static/vendor/highlight/github.min.css">
<link rel="stylesheet" href="/static/themes/base.css">
<link id="lec-theme-css" rel="stylesheet" href="/static/themes/default.css">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/markdown-it/markdown-it.min.js"></script>
<script src="/static/vendor/markdown-it/markdown-it-anchor.min.js"></script>
<script src="/static/vendor/markdown-it/markdown-it-footnote.min.js"></script>
<script src="/static/vendor/markdown-it/markdown-it-task-lists.min.js"></script>
<script src="/static/vendor/highlight/highlight.min.js"></script>
<script src="/static/vendor/highlight/languages/powershell.min.js"></script>
<script src="/static/vendor/highlight/languages/dos.min.js"></script>
<script src="/static/vendor/highlight/languages/dockerfile.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/dompurify/purify.min.js"></script>
<!-- mermaid(약 5MB)는 다이어그램이 있는 문서를 처음 열 때 js/mermaid.js 가 불러온다 -->
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sidebar" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 3.5v13"/></symbol>

    <symbol id="i-forward" viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 20 20"><path d="m5.5 8 4.5 4.5L14.5 8"/></symbol>
    <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2.5 6.2v8.3A1.5 1.5 0 0 0 4 16h12a1.5 1.5 0 0 0 1.5-1.5V7.7A1.5 1.5 0 0 0 16 6.2h-5.8L8.6 4.5H4a1.5 1.5 0 0 0-1.5 1.7z"/></symbol>
    <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m12.8 12.8 4 4"/></symbol>
    <symbol id="i-toc" viewBox="0 0 20 20"><path d="M3 5h14M6.5 10H17M6.5 15H17"/></symbol>
    <symbol id="i-up" viewBox="0 0 20 20"><path d="m5.5 12 4.5-4.5 4.5 4.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 20 20"><path d="m5.5 8 4.5 4.5L14.5 8"/></symbol>
    <symbol id="i-minus" viewBox="0 0 20 20"><path d="M5 10h10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></symbol>
    <symbol id="i-spot" viewBox="0 0 20 20"><path d="M4 3.5h12M4 16.5h12" opacity=".45"/><rect x="2.5" y="7" width="15" height="6" rx="1.5"/><path d="M5.5 10h9"/></symbol>
    <symbol id="i-close" viewBox="0 0 20 20"><path d="m5.5 5.5 9 9m0-9-9 9"/></symbol>
    <symbol id="i-term" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.8"/><path d="m6 8 2.6 2.1L6 12.2M10.5 12.5h3.5"/></symbol>
    <symbol id="i-restart" viewBox="0 0 20 20"><path d="M15.6 10.6A5.6 5.6 0 1 1 13.9 6M14.4 3.4V6.6H11.2"/></symbol>
    <!-- 사이드바 목록의 파일 종류 (icons.js). md·html 은 문서 -->
    <symbol id="i-md" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15M7 14.5v-4.3l1.6 2.1 1.6-2.1v4.3M12.6 10.2v4.3m-1.3-1.4 1.3 1.4 1.3-1.4"/></symbol>
    <symbol id="i-html" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15M8.7 10.2 6.9 12l1.8 1.8M11.3 10.2l1.8 1.8-1.8 1.8"/></symbol>
    <symbol id="i-file" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/></symbol>
    <symbol id="i-text" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15M7.5 9.5h5M7.5 12h5M7.5 14.5h3"/></symbol>
    <symbol id="i-image" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><circle cx="7" cy="8" r="1.3"/><path d="m3 15 4.5-4.5 3 3 2.5-2.5 4.5 4.5"/></symbol>
    <symbol id="i-table" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5"/><path d="M2.5 8h15M2.5 12.3h15M7.5 3.5v13"/></symbol>
    <symbol id="i-code" viewBox="0 0 20 20"><path d="m7 6-4 4 4 4M13 6l4 4-4 4M11.2 4.5l-2.4 11"/></symbol>
    <symbol id="i-box" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M6 8.3h8M6 11.7h5"/></symbol>
    <symbol id="i-diagram" viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6.5" height="5" rx="1"/><rect x="11" y="12.5" width="6.5" height="5" rx="1"/><path d="M5.75 7.5v3.5a1.5 1.5 0 0 0 1.5 1.5H11"/></symbol>
    <symbol id="i-math" viewBox="0 0 20 20"><path d="M15 4.5H5.5l5 5.5-5 5.5H15"/></symbol>
    <symbol id="i-expand" viewBox="0 0 20 20"><path d="M3.5 8V3.5H8M12 3.5h4.5V8M16.5 12v4.5H12M8 16.5H3.5V12"/></symbol>
    <symbol id="i-grid" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-archive" viewBox="0 0 20 20"><path d="M5 2.5h10v15H5z"/><path d="M10 2.5v1.8M10 5.8v1.8M10 9.1v1.8"/><rect x="8.6" y="12.2" width="2.8" height="3" rx=".6"/></symbol>
    <symbol id="i-media" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="m8.5 7.4 4 2.6-4 2.6z"/></symbol>
    <symbol id="i-app" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5"/><path d="M2.5 7h15M6.5 10l2 1.7-2 1.7M10.5 13.4h3"/></symbol>
    <symbol id="i-gear" viewBox="0 0 20 20"><path d="M8.65 4.15L8.86 1.88A8.2 8.2 0 0 1 11.14 1.88L11.35 4.15A6 6 0 0 1 13.18 4.91L14.93 3.45A8.2 8.2 0 0 1 16.55 5.07L15.09 6.82A6 6 0 0 1 15.85 8.65L18.12 8.86A8.2 8.2 0 0 1 18.12 11.14L15.85 11.35A6 6 0 0 1 15.09 13.18L16.55 14.93A8.2 8.2 0 0 1 14.93 16.55L13.18 15.09A6 6 0 0 1 11.35 15.85L11.14 18.12A8.2 8.2 0 0 1 8.86 18.12L8.65 15.85A6 6 0 0 1 6.82 15.09L5.07 16.55A8.2 8.2 0 0 1 3.45 14.93L4.91 13.18A6 6 0 0 1 4.15 11.35L1.88 11.14A8.2 8.2 0 0 1 1.88 8.86L4.15 8.65A6 6 0 0 1 4.91 6.82L3.45 5.07A8.2 8.2 0 0 1 5.07 3.45L6.82 4.91A6 6 0 0 1 8.65 4.15Z"/><circle cx="10" cy="10" r="2.5"/></symbol>

</svg>

<div id="lec-app">
  <header id="lec-toolbar">
    <div class="tb-group">
      <button id="lec-btn-sidebar" class="icon-btn" title="사이드바 보이기/숨기기 (Ctrl+B)"><svg><use href="#i-sidebar"/></svg></button>
      <button id="lec-btn-back" class="icon-btn" title="뒤로 (Alt+←)" disabled><svg><use href="#i-back"/></svg></button>
      <button id="lec-btn-forward" class="icon-btn" title="앞으로 (Alt+→)" disabled><svg><use href="#i-forward"/></svg></button>
    </div>
    <div class="tb-spacer"></div>
    <button id="lec-btn-palette" class="search-btn" title="이름·제목으로 문서 열기 (Ctrl+P)"><svg><use href="#i-search"/></svg><span>문서 열기</span><kbd>Ctrl P</kbd></button>
    <div class="text-size" role="group" aria-label="글자 크기">
      <button id="lec-text-smaller" class="icon-btn step" title="글자 작게" aria-label="글자 작게"><svg><use href="#i-minus"/></svg></button>
      <button id="lec-text-reset" class="size-label" title="글자 크기 (누르면 100%로)">100%</button>
      <button id="lec-text-bigger" class="icon-btn step" title="글자 크게" aria-label="글자 크게"><svg><use href="#i-plus"/></svg></button>
    </div>
    <div class="theme-pick">
      <label for="lec-theme" class="pick-label">스타일</label>
      <select id="lec-theme" title="문서 스타일" aria-label="문서 스타일"><!-- 목록은 theme.js 의 THEMES 로 채운다 --></select>
      <button id="lec-theme-prev" class="icon-btn step" title="위 스타일로" aria-label="위 스타일로"><svg><use href="#i-up"/></svg></button>
      <button id="lec-theme-next" class="icon-btn step" title="아래 스타일로" aria-label="아래 스타일로"><svg><use href="#i-down"/></svg></button>
    </div>
    <div class="spot-pick">
      <button id="lec-btn-spot" class="icon-btn" title="장 하이라이트" disabled><svg><use href="#i-spot"/></svg><span>하이라이트</span></button>
      <button id="lec-spot-prev" class="icon-btn step" title="앞 장 하이라이트 (↑)" aria-label="앞 장 하이라이트" disabled><svg><use href="#i-up"/></svg></button>
      <button id="lec-spot-next" class="icon-btn step" title="다음 장 하이라이트 (↓)" aria-label="다음 장 하이라이트" disabled><svg><use href="#i-down"/></svg></button>
    </div>
    <button id="lec-btn-settings" class="icon-btn" title="설정 (Ctrl+,)"><svg><use href="#i-gear"/></svg></button>
    <button id="lec-btn-term" class="icon-btn" title="터미널 열기/닫기 (Ctrl+`) — 이 프로젝트 폴더의 PowerShell"><svg><use href="#i-term"/></svg></button>
    <button id="lec-btn-toc" class="icon-btn" title="목차 보이기/숨기기"><svg><use href="#i-toc"/></svg></button>
  </header>

  <!-- 프로젝트 탭 (tabs.js): 폴더마다 탭 하나. 탭을 누르면 사이드바와 문서 화면이 함께 바뀐다 -->
  <nav id="lec-tabbar" aria-label="프로젝트 탭">
    <div id="lec-tablist" role="tablist"></div>
    <button id="lec-btn-open" class="icon-btn small" title="폴더 열기 — 새 탭으로 (Ctrl+O)" aria-label="폴더 열기"><svg><use href="#i-plus"/></svg></button>
    <button id="lec-btn-recent" class="icon-btn small" title="최근 연 폴더" aria-label="최근 연 폴더"><svg><use href="#i-chevron"/></svg></button>
    <!-- 터미널 모음 (gather.js, D40): 열린 프로젝트들의 터미널을 한 화면에 -->
    <button id="lec-btn-gather" class="gather-btn" aria-pressed="false" title="터미널 모음 — 열린 프로젝트들의 터미널을 한 화면에 (Ctrl+Shift+`)"><svg><use href="#i-term"/></svg><span>터미널 모음</span><span id="lec-gather-count" class="n" hidden></span></button>
  </nav>

  <div id="lec-main">
    <aside id="lec-sidebar">
      <div class="side-tabs" role="tablist">
        <button role="tab" data-tab="files" class="active">파일</button>
        <button role="tab" data-tab="recent">최근 변경<span id="lec-changed-count" class="count" hidden></span></button>
        <button role="tab" data-tab="search" title="모든 문서의 본문에서 찾기 (Ctrl+Shift+F)">검색</button>
        <button role="tab" data-tab="parts" title="프로젝트의 표·그림·박스글·다이어그램·코드·수식을 종류마다 모아 보기">모아 보기</button>
      </div>
      <div class="side-filter">
        <input id="lec-filter" type="search" placeholder="이름·제목으로 거르기" spellcheck="false" autocomplete="off">
        <button id="lec-btn-titles" class="icon-btn small toggle" title="파일 이름 대신 문서 제목으로 보기 (끄면 파일 이름, 마우스를 올리면 제목)">제목</button>
        <button id="lec-btn-view" class="icon-btn small toggle" title="폴더 구조 그대로 보기 — 문서와 파일을 한 트리에 (끄면 종류별: 문서 위, 파일 아래)">폴더</button>
      </div>
      <!-- 문서 트리와 '파일' 목록 (others.js): 종류별 보기에서는 사이의 분리선을 끌어 아래 목록의 높이를 바꾸고, 머리줄을 눌러 접는다.
           폴더 보기에서는 문서 트리·분리선·머리줄을 감추고 '파일' 목록에 문서와 파일을 폴더 구조 그대로 함께 보인다 -->
      <div id="lec-files">
        <nav id="lec-tree" class="side-list" aria-label="문서"></nav>
        <div id="lec-others-split" role="separator" aria-orientation="horizontal" title="끌어서 높이 조절 (두 번 누르면 기본 높이)"></div>
        <section id="lec-others" aria-label="파일">
          <button type="button" id="lec-others-head" class="side-head" aria-expanded="true" title="파일 목록 펼치기/접기 (문서가 아닌 파일)">
            <span class="caret open" aria-hidden="true"></span><span>파일</span><span id="lec-others-count" class="n"></span></button>
          <div id="lec-others-list" class="side-list" role="tree" aria-label="파일"></div>
        </section>
      </div>
      <nav id="lec-recent" class="side-list" aria-label="최근 변경" hidden></nav>
      <div id="lec-search" hidden>
        <div class="side-filter">
          <input id="lec-search-input" type="search" placeholder="모든 문서의 본문에서 찾기" spellcheck="false" autocomplete="off">
        </div>
        <p id="lec-search-info" class="side-info"></p>
        <nav id="lec-search-results" class="side-list" aria-label="검색 결과"></nav>
      </div>
      <!-- 모아 보기 (parts.js, D41): 종류 버튼, 범위(폴더), 거르기, 문서별 목록 (그림은 작은 그림 격자) -->
      <div id="lec-parts" hidden>
        <div id="lec-parts-kinds" class="parts-kinds" role="tablist" aria-label="모아 볼 종류"></div>
        <div class="parts-bar">
          <span class="parts-scope-label">범위</span><span id="lec-parts-scope" class="parts-scope"></span>
          <button type="button" id="lec-parts-all" class="text-btn" title="프로젝트 전체로" hidden>전체</button>
          <span class="tb-spacer"></span>
          <button type="button" id="lec-parts-order" class="icon-btn small toggle">트리 순서</button>
        </div>
        <div class="side-filter">
          <input id="lec-parts-filter" type="search" placeholder="이름·절·문서로 거르기" spellcheck="false" autocomplete="off">
        </div>
        <p id="lec-parts-info" class="side-info"></p>
        <nav id="lec-parts-list" class="side-list" aria-label="모아 본 구성 요소"></nav>
      </div>
    </aside>

    <div id="lec-resizer" role="separator" aria-orientation="vertical" title="끌어서 사이드바 폭 조절 (두 번 누르면 기본 폭)"></div>
    <!-- 문서 칸 (panes.js): 탭마다 하나를 겹쳐 두고 선택된 탭의 칸만 보인다. 여기 있는 칸은 탭이 없을 때의 시작 화면.
         선택된 칸의 스크롤 상자·본문이 #lec-content·#lec-view id 를 갖는다 -->
    <main id="lec-panes">
      <section class="lec-pane active">
        <div id="lec-content" class="lec-scroll" tabindex="-1">
          <div id="lec-findbar" hidden>
            <div class="fb">
              <input id="lec-find-input" type="text" placeholder="문서에서 찾기" spellcheck="false" autocomplete="off">
              <span id="lec-find-count"></span>
              <button id="lec-find-prev" class="icon-btn small" title="이전 (Shift+Enter)"><svg><use href="#i-up"/></svg></button>
              <button id="lec-find-next" class="icon-btn small" title="다음 (Enter)"><svg><use href="#i-down"/></svg></button>
              <button id="lec-find-close" class="icon-btn small" title="닫기 (Esc)"><svg><use href="#i-close"/></svg></button>
            </div>
          </div>
          <article id="lec-view"></article>
        </div>
      </section>
    </main>

    <aside id="lec-toc" aria-label="목차"></aside>
    <!-- 오른쪽 터미널 (terminal.js, D38): 프로젝트 탭마다 셸 하나. 사용자가 열 때만 시작한다. 경계를 끌어 폭 조절 -->
    <div id="lec-term-resizer" role="separator" aria-orientation="vertical" title="끌어서 터미널 폭 조절 (두 번 누르면 기본 폭)" hidden></div>
    <section id="lec-term" aria-label="터미널" hidden>
      <div class="term-head">
        <svg class="term-icon" aria-hidden="true"><use href="#i-term"/></svg><span id="lec-term-title">터미널</span>
        <button type="button" id="lec-term-restart" class="icon-btn small" title="셸 다시 시작 (지금 셸과 거기서 띄운 프로그램은 끝남)"><svg><use href="#i-restart"/></svg></button>
        <button type="button" id="lec-term-close" class="icon-btn small" title="터미널 닫기 (Ctrl+`) — 셸은 닫지 않음"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="lec-term-body"></div>
    </section>
    <!-- 터미널 모음 (gather.js): 문서 화면 위를 덮는 격자. 탭마다 칸 하나 -->
    <section id="lec-gather" aria-label="터미널 모음" hidden></section>
  </div>

  <footer id="lec-status">
    <span id="lec-st-path"></span>
    <span id="lec-st-info"></span>
    <button id="lec-st-changes" class="st-changes" hidden></button>
    <span class="tb-spacer"></span>
    <span id="lec-st-watch"></span>
  </footer>
</div>

<div id="lec-palette" class="overlay" hidden>
  <div class="palette-box" role="dialog" aria-label="문서 빠르게 열기">
    <input id="lec-palette-input" type="text" placeholder="문서 이름, 제목, 경로" spellcheck="false" autocomplete="off">
    <ul id="lec-palette-list" role="listbox"></ul>
  </div>
</div>
<div id="lec-settings" class="overlay" hidden>
  <div class="dialog-box" role="dialog" aria-labelledby="lec-settings-title">
    <h2 id="lec-settings-title">설정</h2>
    <div class="opt-choice" role="radiogroup" aria-labelledby="lec-groups-title">
      <span class="opt-head"><b id="lec-groups-title">스타일 목록 묶기</b><small>툴바의 스타일 목록을 나누는 방식입니다</small></span>
      <label><input type="radio" name="theme_groups" value="use"><span>용도별<small>업무·보고 / 읽기·출판 / 개발·기술 / 어두운</small></span></label>
      <label><input type="radio" name="theme_groups" value="mood"><span>분위기별<small>깔끔한 / 따뜻한·종이 / 색이 있는 / 어두운</small></span></label>
      <label><input type="radio" name="theme_groups" value="tone"><span>밝기별<small>밝은 / 종이·책 / 어두운</small></span></label>
    </div>
    <label class="opt"><input type="checkbox" data-key="restore_last"><span><b>마지막 위치에서 시작</b><small>폴더를 열면 마지막에 보던 문서와 스크롤 위치로 엽니다</small></span></label>
    <label class="opt"><input type="checkbox" data-key="expand_first_level"><span><b>첫 단계 폴더 펼치기</b><small>폴더를 열 때 트리의 첫 단계 폴더를 펼쳐 둡니다</small></span></label>
    <label class="opt"><input type="checkbox" data-key="math"><span><b>수식 표시</b><small>$…$, $$…$$ 와 math·latex 코드 블록을 수식으로 그립니다</small></span></label>
    <label class="opt"><input type="checkbox" data-key="external_images"><span><b>인터넷 그림 표시</b><small>문서 속 https 그림을 불러옵니다. 끄면 링크로만 보이고 인터넷에 요청하지 않습니다. 바꾸면 화면을 다시 불러옵니다</small></span></label>
    <label class="opt"><input type="checkbox" data-key="terminal_follow_style"><span><b>터미널 색을 스타일에 맞춤</b><small>오른쪽 터미널의 바탕·글자 색을 문서 스타일에 맞춥니다. 끄면 늘 어두운 색입니다</small></span></label>
    <div class="dialog-file">
      <button type="button" id="lec-settings-file" class="text-btn">설정 파일 열기</button>
      <small>편집기 경로(editor)·제외 폴더(exclude_dirs)·터미널 셸(terminal_shell)처럼 여기 없는 설정은 파일에서 고칩니다. 저장하면 반영되고, 트리는 F5 를 누르면 다시 불러옵니다.</small>
    </div>
    <div class="dialog-foot">
      <span id="lec-settings-ver"></span>
      <button type="button" id="lec-settings-close" class="primary">닫기</button>
    </div>
  </div>
</div>
<div id="lec-menu" class="menu" role="menu" hidden></div>
<div id="lec-lightbox" class="overlay" hidden></div>
<div id="lec-toast" role="status" hidden></div>
</body>
</html>
