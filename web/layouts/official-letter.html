<!--lectern-layout
name: 공문 (기안문)
name_en: Official letter (Korean)
group: 업무·공공
group_en: Office and public sector
pages: A4
fields: org, 수신, 경유, title, 발신, 기안자, 검토자, 결재권자, 시행, 접수, 주소, 전화, 전자우편, 공개구분
description: 행정기관 기안문의 꼴 — 기관명, 수신·경유·제목, 본문(1. 가. 1) 가) 는 파일에), 발신 명의, 결재 줄, 시행·주소·연락처. 여백 위 30·아래 15·왼쪽 20·오른쪽 15mm
description_en: The layout of a Korean official letter — agency name, recipient, via and subject, body (write 1. 가. 1) 가) in the file), sender, approvals, and the footer lines
-->
<style>
:root {
  --md-font: "맑은 고딕", "Malgun Gothic", "함초롬돋움", "HCR Dotum", sans-serif;
  --md-heading-font: var(--md-font);
  --md-size: 14px; --md-line: 1.7;
  --md-fg: #111; --md-heading: #111; --md-border: #888;
  --lay-pad: 30mm 15mm 15mm 20mm;
}
@page { size: A4; margin: 30mm 15mm 15mm 20mm; }
.lay-official-letter .lay-org { margin: 0 0 6mm; text-align: center; font: 700 20pt/1.3 var(--md-font); letter-spacing: .08em; }
.lay-official-letter .lay-rows { margin: 0 0 5mm; border-collapse: collapse; width: 100%; font-size: 13.5px; }
.lay-official-letter .lay-rows th { width: 15mm; padding: .6mm 0; text-align: left; font-weight: 400; color: #111; vertical-align: top; background: none; }
.lay-official-letter .lay-rows td { padding: .6mm 0; border: 0; }
.lay-official-letter .lay-rows tr.subject td { font-weight: 700; }
.lay-official-letter .lay-rule { border: 0; border-top: 2px solid #111; margin: 0 0 5mm; }
.lay-official-letter .md-body h1 { display: none; }
.lay-official-letter .md-body h2, .lay-official-letter .md-body h3 { font-size: 1em; font-weight: 700; margin: .8em 0 .3em; border: 0; padding: 0; }
.lay-official-letter .md-body p { margin: .3em 0; }
.lay-official-letter .md-body ol, .lay-official-letter .md-body ul { padding-left: 1.4em; }
.lay-official-letter .lay-from { margin: 14mm 0 8mm; text-align: center; font: 700 17pt var(--md-font); letter-spacing: .15em; }
.lay-official-letter .lay-approve { width: 100%; border-collapse: collapse; font-size: 12px; border-top: 1px solid #111; border-bottom: 1px solid #111; }
.lay-official-letter .lay-approve td { border: 0; padding: 1.5mm 2mm 1.5mm 0; }
.lay-official-letter .lay-approve td span + span::before { content: "  "; }
.lay-official-letter .lay-foot { margin-top: 2mm; font-size: 11.5px; line-height: 1.6; color: #222; }
.lay-official-letter .lay-foot span + span::before { content: " / "; color: #777; }
</style>
<p class="lay-org" data-if="org">{{org}}</p>
<table class="lay-rows">
  <tr data-if="수신"><th>{{t:수신|To}}</th><td>{{수신}}</td></tr>
  <tr data-if="경유"><th>{{t:(경유)|(Via)}}</th><td>{{경유}}</td></tr>
  <tr class="subject" data-if="title"><th>{{t:제목|Subject}}</th><td>{{title}}</td></tr>
</table>
<hr class="lay-rule">
<main class="md-body">{{body}}</main>
<p class="lay-from" data-if="발신">{{발신}}</p>
<table class="lay-approve" data-if="기안자">
  <tr><td><span>{{t:기안자|Drafted by}}</span><span>{{기안자}}</span></td><td data-if="검토자"><span>{{t:검토자|Reviewed by}}</span><span>{{검토자}}</span></td><td data-if="결재권자"><span>{{t:결재권자|Approved by}}</span><span>{{결재권자}}</span></td></tr>
</table>
<p class="lay-foot">
  <span data-if="시행">{{t:시행|Issued}} {{시행}}</span><span data-if="접수">{{t:접수|Received}} {{접수}}</span><br data-if="주소">
  <span data-if="주소">{{주소}}</span><span data-if="전화">{{t:전화|Tel}} {{전화}}</span><span data-if="전자우편">{{전자우편}}</span><span data-if="공개구분">{{공개구분}}</span>
</p>
