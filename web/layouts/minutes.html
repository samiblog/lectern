<!--lectern-layout
name: 회의록
name_en: Meeting minutes
group: 업무·공공
group_en: Office and public sector
pages: A4
fields: title, date, 시간, 장소, 참석자, 작성자
description: 위에 일시·장소·참석자·작성자 표, 안건·논의·결정·할 일 절을 굵은 띠로. 할 일 목록은 체크 칸 그대로
description_en: A table of date, place, attendees and writer on top, agenda, discussion, decisions and to-dos as banded sections
-->
<style>
:root {
  --md-font: "맑은 고딕", "Malgun Gothic", "Pretendard", sans-serif;
  --md-heading-font: var(--md-font);
  --md-size: 13px; --md-line: 1.65;
  --md-fg: #1d1d1d; --md-heading: #1d1d1d; --md-border: #c9c9c9;
  --md-th-bg: #f0f0f0; --md-th-fg: #1d1d1d; --md-th-rule: #555;
  --lay-pad: 18mm;
}
@page { size: A4; margin: 18mm; @bottom-right { content: counter(page) " / " counter(pages); font: 8.5pt "Malgun Gothic", sans-serif; color: #777; } }
.lay-minutes .lay-title { margin: 0 0 5mm; padding: 0; border: 0; text-align: center; font: 800 20pt/1.3 var(--md-font); letter-spacing: .1em; }
.lay-minutes .lay-info { width: 100%; margin: 0 0 6mm; border-collapse: collapse; font-size: 10.5pt; }
.lay-minutes .lay-info th { width: 22mm; padding: 2mm; background: #f0f0f0; border: 1px solid #999; text-align: center; font-weight: 700; }
.lay-minutes .lay-info td { padding: 2mm 3mm; border: 1px solid #999; }
.lay-minutes .md-body h2 { margin: 1.1em 0 .5em; padding: 1.2mm 3mm; background: #2b2b2b; color: #fff; border: 0; font-size: 11.5pt; letter-spacing: .04em; }
.lay-minutes .md-body h3 { margin: .9em 0 .35em; font-size: 11pt; border-bottom: 1px solid #ccc; padding-bottom: .1em; }
.lay-minutes .md-body ul, .lay-minutes .md-body ol { padding-left: 1.4em; }
.lay-minutes .md-body .task-list-item { list-style: none; margin-left: -1.2em; }
</style>
<h1 class="lay-title">{{title}}</h1>
<table class="lay-info">
  <tr><th>{{t:일시|Date}}</th><td>{{date:long}}<span data-if="시간"> {{시간}}</span></td><th>{{t:장소|Place}}</th><td>{{장소}}</td></tr>
  <tr data-if="참석자"><th>{{t:참석자|Attendees}}</th><td colspan="3">{{참석자}}</td></tr>
  <tr data-if="작성자"><th>{{t:작성자|Minutes by}}</th><td colspan="3">{{작성자}}</td></tr>
</table>
<main class="md-body">{{body}}</main>
