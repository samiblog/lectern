<!--lectern-layout
name: 컨설팅 보고서
name_en: Consulting report
group: 금융·컨설팅
group_en: Finance and consulting
pages: A4
fields: org, client, title, subtitle, date
slots: 요약
description: 결론부터 쓰는 보고서 — 절 제목(##)을 결론 문장으로 크게, 표·그림은 '전시물'처럼 캡션 띠와 출처 줄, 요약 상자, 쪽 바닥에 고객·기관과 쪽 번호
description_en: Answer-first report — section headings as full-sentence takeaways, tables and charts as exhibits with a caption bar and source line, a summary box, client and page number in the footer
-->
<style>
:root {
  --md-font: "Pretendard", "맑은 고딕", "Malgun Gothic", "Arial", sans-serif;
  --md-heading-font: "Georgia", "함초롬바탕", "HCR Batang", "바탕", serif;
  --md-size: 13px; --md-line: 1.62;
  --md-fg: #1e1e1e; --md-heading: #051c2c; --md-muted: #5f6b73; --md-border: #d6dadd; --md-link: #2251ff;
  --md-th-bg: #051c2c; --md-th-fg: #ffffff; --md-th-rule: #051c2c; --md-stripe: #f4f6f7;
  --lay-pad: 20mm 20mm;
}
@page { size: A4; margin: 20mm 20mm 20mm; @bottom-left { content: {{css:client|org}}; font: 7.5pt "Malgun Gothic", sans-serif; color: #888; } @bottom-right { content: counter(page); font: 8pt "Malgun Gothic", sans-serif; color: #051c2c; } }
.lay-consulting .lay-head { margin: 0 0 8mm; padding: 0 0 6mm; border-bottom: 1px solid #051c2c; }
.lay-consulting .lay-head .k { margin: 0 0 3mm; font: 700 8.5pt var(--md-font); letter-spacing: .2em; color: #2251ff; text-transform: uppercase; }
.lay-consulting .lay-head h1 { margin: 0; padding: 0; border: 0; font: 400 26pt/1.2 var(--md-heading-font); color: #051c2c; letter-spacing: -.01em; }
.lay-consulting .lay-head .sub { margin: 3mm 0 0; font: 400 12.5pt/1.45 var(--md-font); color: #444; }
.lay-consulting .lay-head .meta { margin: 4mm 0 0; font: 9pt var(--md-font); color: #5f6b73; }
.lay-consulting .lay-head .meta span + span::before { content: "  |  "; color: #bbb; }
.lay-consulting .lay-exec { margin: 0 0 8mm; padding: 5mm 6mm; background: #eef1f6; }
.lay-consulting .lay-exec .lay-label { margin: 0 0 2mm; font: 700 9pt var(--md-font); letter-spacing: .15em; color: #2251ff; text-transform: uppercase; }
.lay-consulting .md-body h2 { margin: 1.6em 0 .55em; padding: 0; border: 0; font: 400 16.5pt/1.3 var(--md-heading-font); color: #051c2c; }
.lay-consulting .md-body h3 { margin: 1.1em 0 .35em; font: 700 11pt var(--md-font); color: #051c2c; }
.lay-consulting .md-body .caption { margin: 1.2em 0 .45em; padding: 0 0 1.5mm; border-bottom: 2px solid #051c2c; font: 700 9.5pt var(--md-font); color: #051c2c; }
.lay-consulting .md-body p.lec-source { margin-top: .3em; font-size: 7.8pt; color: #5f6b73; }
.lay-consulting .md-body table { font-size: 9.2pt; }
.lay-consulting .md-body blockquote:not(.alert) { margin: 1.2em 0; padding: 0 0 0 5mm; border-left: 3px solid #2251ff; font: italic 13pt/1.55 var(--md-heading-font); color: #051c2c; }
.lay-consulting .md-body .lec-textbox { border: 0; background: #eef1f6; border-top: 3px solid #2251ff; }
</style>
<header class="lay-head">
  <p class="k" data-if="client">{{client}}</p>
  <h1>{{title}}</h1>
  <p class="sub" data-if="subtitle">{{subtitle}}</p>
  <p class="meta"><span data-if="org">{{org}}</span><span>{{date:long}}</span></p>
</header>
<section class="lay-exec" data-if="slot:요약"><p class="lay-label">{{t:요약|Executive summary}}</p><div class="lay-slot">{{slot:요약}}</div></section>
<main class="md-body">{{body}}</main>
