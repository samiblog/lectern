<!--lectern-layout
name: 정부 보고서
name_en: Government report
group: 업무·공공
group_en: Office and public sector
pages: A4
fields: title, date, dept, author
slots: 요약
description: 두 줄 테두리의 제목 상자, 오른쪽 위 날짜·부서, 명조 본문과 고딕 머리글. □ ○ - ※ 기호는 md 문서 스타일 '개조식'으로 파일에 씁니다
description_en: A double-ruled title box, date and department top right, serif body with sans headings. Write the □ ○ - ※ marks in the file with the md document style 'bulleted'
-->
<style>
:root {
  --md-font: "휴먼명조", "HumanMyeongjo", "함초롬바탕", "HCR Batang", "바탕", "Batang", "Noto Serif KR", serif;
  --md-heading-font: "HY헤드라인M", "HYHeadLine-Medium", "맑은 고딕", "Malgun Gothic", sans-serif;
  --md-size: 14.5px; --md-line: 1.65;
  --md-fg: #111111; --md-heading: #111111; --md-muted: #444444; --md-border: #999999; --md-link: #1a3f8f;
  --md-th-bg: #e8edf4; --md-th-fg: #111111; --md-th-rule: #333333; --md-stripe: #ffffff;
  --lay-pad: 20mm 20mm 15mm;
}
@page { size: A4; margin: 20mm 20mm 15mm; @bottom-center { content: "- " counter(page) " -"; font: 10pt "바탕", "Batang", serif; } }
.lay-gov-report .lay-title { margin: 0 0 6mm; padding: 4mm 6mm; border-top: 3px double #111; border-bottom: 3px double #111; text-align: center; }
.lay-gov-report .lay-title h1 { margin: 0; font: 700 22pt/1.3 var(--md-heading-font); letter-spacing: -.01em; border: 0; color: #111; }
.lay-gov-report .lay-title .sub { margin: 2mm 0 0; font: 400 12pt/1.4 var(--md-font); color: #333; }
.lay-gov-report .lay-meta { margin: 0 0 7mm; text-align: right; font: 11pt/1.5 var(--md-font); color: #222; }
.lay-gov-report .lay-meta span + span::before { content: " · "; }
.lay-gov-report .lay-summary { margin: 0 0 7mm; padding: 4mm 5mm; border: 1px solid #333; background: #f3f5f8; font-size: .97em; }
.lay-gov-report .lay-summary .lay-label { margin: 0 0 2mm; font: 700 11pt var(--md-heading-font); letter-spacing: .3em; }
.lay-gov-report .md-body h2 { margin: 1.3em 0 .55em; padding: 0; font: 700 15pt/1.4 var(--md-heading-font); border: 0; color: #111; }
.lay-gov-report .md-body h3 { margin: 1em 0 .45em; font: 700 13pt/1.45 var(--md-font); color: #111; }
.lay-gov-report .md-body h4 { margin: .9em 0 .4em; font: 700 12pt var(--md-font); }
.lay-gov-report .md-body p, .lay-gov-report .md-body li { text-align: justify; }
.lay-gov-report .md-body ul, .lay-gov-report .md-body ol { padding-left: 1.5em; }
.lay-gov-report .md-body table { font-size: .9em; border-top: 2px solid #111; border-bottom: 2px solid #111; }
.lay-gov-report .md-body th { font-family: "맑은 고딕", "Malgun Gothic", sans-serif; font-weight: 700; }
.lay-gov-report .md-body .caption { font: 700 .95em var(--md-heading-font); }
.lay-gov-report .md-body blockquote.alert { border-left-width: 0; border: 1px solid #555; background: none; padding: .5em .9em; }
.lay-gov-report .md-body .lec-textbox { border: 1px solid #333; border-top: 1px solid #333; background: #f7f7f7; }
.lay-gov-report .md-body .lec-textbox > .lec-textbox-title { background: #e9e9e9; color: #111; }
</style>
<header class="lay-title" data-if="title">
  <h1>{{title}}</h1>
  <p class="sub" data-if="subtitle">{{subtitle}}</p>
</header>
<p class="lay-meta"><span>{{date:dot}}</span><span data-if="dept">{{dept}}</span><span data-if="author">{{author}}</span></p>
<section class="lay-summary" data-if="slot:요약"><p class="lay-label">{{t:요 약|Summary}}</p><div class="lay-slot">{{slot:요약}}</div></section>
<main class="md-body">{{body}}</main>
