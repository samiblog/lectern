<!--lectern-layout
name: 연구보고서
name_en: Research report
group: 연구
group_en: Research
pages: A4
fields: org, number, title, subtitle, author, date
slots: 요약
description: 연구원 보고서의 꼴 — 표지(기관·보고서 번호·제목·연구진·발행일), 요약 쪽, 차례 쪽, 큰 절(##)마다 새 쪽, 쪽 머리에 보고서 제목
description_en: A research institute report — cover (institute, report number, title, authors, date), a summary page, a contents page, each major section on a new page, the report title in the header
-->
<style>
:root {
  --md-font: "함초롬바탕", "HCR Batang", "바탕", "Batang", "Noto Serif KR", "Times New Roman", serif;
  --md-heading-font: "함초롬돋움", "HCR Dotum", "맑은 고딕", "Malgun Gothic", sans-serif;
  --md-size: 14px; --md-line: 1.75;
  --md-fg: #1c1c1c; --md-heading: #0f2c4c; --md-muted: #555; --md-border: #c3c8cf; --md-link: #0f2c4c;
  --md-th-bg: #eef2f6; --md-th-fg: #0f2c4c; --md-th-rule: #0f2c4c; --md-stripe: #fafbfc;
  --lay-pad: 25mm 22mm;
}
@page { size: A4; margin: 25mm 22mm 22mm; @top-left { content: {{css:title}}; font: 8.5pt "HCR Dotum", "Malgun Gothic", sans-serif; color: #666; vertical-align: bottom; padding-bottom: 4mm; } @bottom-center { content: counter(page); font: 9pt "HCR Batang", "Batang", serif; color: #444; } }
@page cover { margin: 0; @top-left { content: none; } @bottom-center { content: none; } }
@page front { @top-left { content: none; } @bottom-center { content: none; } }
.lay-research-report .lay-cover { page: cover; position: relative; height: 296mm; padding: 38mm 24mm 24mm; background: #ffffff; break-after: page; }
.lay-research-report .lay-cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14mm; background: #0f2c4c; }
.lay-research-report .lay-cover .no { font: 700 11pt var(--md-heading-font); color: #0f2c4c; letter-spacing: .06em; margin: 0; }
.lay-research-report .lay-cover h1 { margin: 22mm 0 0; padding: 0; border: 0; font: 800 28pt/1.3 var(--md-heading-font); color: #0f2c4c; letter-spacing: -.02em; }
.lay-research-report .lay-cover .sub { margin: 6mm 0 0; font: 400 14pt/1.5 var(--md-heading-font); color: #333; }
.lay-research-report .lay-cover .who { position: absolute; left: 24mm; bottom: 46mm; margin: 0; font: 12pt/1.7 var(--md-heading-font); color: #222; }
.lay-research-report .lay-cover .org { position: absolute; left: 24mm; right: 24mm; bottom: 24mm; margin: 0; padding-top: 5mm; border-top: 1.5px solid #0f2c4c; font: 800 15pt var(--md-heading-font); color: #0f2c4c; }
.lay-research-report .lay-cover .org small { float: right; font: 400 11pt var(--md-heading-font); color: #444; }
.lay-research-report .lay-front { page: front; break-after: page; }
.lay-research-report .lay-front > h2 { margin: 0 0 8mm; padding: 0 0 3mm; border-bottom: 2px solid #0f2c4c; font: 800 18pt var(--md-heading-font); color: #0f2c4c; }
.lay-research-report .lay-toc li { font: 11.5pt/1.9 var(--md-heading-font); }
.lay-research-report .lay-toc li.lv2 { font-weight: 700; margin-top: 2mm; }
.lay-research-report .md-body > h2 { break-before: page; margin: 0 0 7mm; padding: 0 0 3mm; border-bottom: 2px solid #0f2c4c; font: 800 17pt/1.35 var(--md-heading-font); color: #0f2c4c; }
.lay-research-report .md-body > h2:first-child { break-before: auto; }
.lay-research-report .md-body h3 { margin: 1.4em 0 .5em; font: 700 13pt var(--md-heading-font); color: #0f2c4c; }
.lay-research-report .md-body h4 { margin: 1.1em 0 .4em; font: 700 11.5pt var(--md-heading-font); }
.lay-research-report .md-body p { text-align: justify; }
.lay-research-report .md-body table { font: 10pt/1.5 var(--md-heading-font); border-top: 2px solid #0f2c4c; border-bottom: 1.5px solid #0f2c4c; }
.lay-research-report .md-body .caption { margin-bottom: .3em; font: 700 10.5pt var(--md-heading-font); color: #0f2c4c; text-align: center; }
.lay-research-report .md-body p.lec-source { font: 9pt var(--md-heading-font); }
.lay-research-report .md-body .footnotes { font-size: 9pt; }
</style>
<section class="lay-cover">
  <p class="no" data-if="number">{{number}}</p>
  <h1>{{title}}</h1>
  <p class="sub" data-if="subtitle">{{subtitle}}</p>
  <p class="who" data-if="author">{{t:연구진|Authors}}: {{author}}</p>
  <p class="org"><span>{{org|' '}}</span><small>{{date:long}}</small></p>
</section>
<section class="lay-front" data-if="slot:요약"><h2>{{t:요 약|Summary}}</h2><div class="lay-slot md-body">{{slot:요약}}</div></section>
<section class="lay-front"><h2>{{t:차 례|Contents}}</h2>{{toc}}</section>
<main class="md-body">{{body}}</main>
