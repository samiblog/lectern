<!--lectern-layout
name: 이슈 브리프
name_en: Issue brief
group: 연구
group_en: Research
pages: A4
fields: org, series, number, title, subtitle, author, date
slots: 핵심
description: 정책 브리프·동향 분석 2~4쪽 — 위에 기관·시리즈·호수 띠, 제목 아래 '핵심' 상자(이름이 '핵심'인 박스글), 쪽 머리에 시리즈 이름
description_en: A 2–4 page policy or trend brief — an institute, series and issue band, a key points box under the title (box named 핵심), the series name in the header
-->
<style>
:root {
  --md-font: "맑은 고딕", "Malgun Gothic", "Pretendard", "Segoe UI", sans-serif;
  --md-heading-font: var(--md-font);
  --md-size: 13.5px; --md-line: 1.7;
  --md-fg: #1e2328; --md-heading: #00566b; --md-muted: #56606a; --md-border: #cfd6dc; --md-link: #00566b;
  --md-th-bg: #00566b; --md-th-fg: #ffffff; --md-th-rule: #00566b; --md-stripe: #f2f7f8;
  --lay-pad: 0 18mm 18mm;
}
@page { size: A4; margin: 20mm 18mm 18mm; @top-right { content: {{css:series|org}}; font: 8.5pt "Malgun Gothic", sans-serif; color: #00566b; } @bottom-right { content: counter(page); font: 8.5pt "Malgun Gothic", sans-serif; color: #666; } }
@page :first { margin-top: 0; @top-right { content: none; } }
.lay-issue-brief .lay-band { display: flex; justify-content: space-between; align-items: center; margin: 0 -18mm 9mm; padding: 6mm 18mm; background: #00566b; color: #fff; }
.lay-issue-brief .lay-band .series { font: 800 13pt var(--md-font); letter-spacing: .04em; }
.lay-issue-brief .lay-band .issue { font: 10pt var(--md-font); opacity: .9; }
.lay-issue-brief h1.lay-h { margin: 0; padding: 0; border: 0; font: 800 23pt/1.3 var(--md-font); color: #10242e; letter-spacing: -.02em; }
.lay-issue-brief .lay-sub { margin: 3mm 0 0; font: 400 13pt/1.45 var(--md-font); color: #3a4a52; }
.lay-issue-brief .lay-by { margin: 4mm 0 7mm; padding-bottom: 4mm; border-bottom: 1px solid #cfd6dc; font-size: 10pt; color: #56606a; }
.lay-issue-brief .lay-by span + span::before { content: " · "; }
.lay-issue-brief .lay-key { margin: 0 0 8mm; padding: 4.5mm 6mm; background: #eaf3f5; border-top: 3px solid #00566b; }
.lay-issue-brief .lay-key .lay-label { margin: 0 0 2mm; font: 800 11pt var(--md-font); color: #00566b; letter-spacing: .05em; }
.lay-issue-brief .lay-key ul { margin: 0; padding-left: 1.2em; }
.lay-issue-brief .lay-key li { margin: .25em 0; font-weight: 600; }
.lay-issue-brief .md-body h2 { margin: 1.4em 0 .5em; padding: 0 0 0 3mm; border: 0; border-left: 4px solid #00566b; font: 800 14pt/1.35 var(--md-font); color: #10242e; }
.lay-issue-brief .md-body h3 { margin: 1.1em 0 .4em; font: 700 12pt var(--md-font); color: #00566b; }
.lay-issue-brief .md-body .caption { font-weight: 700; font-size: .92em; color: #00566b; }
.lay-issue-brief .md-body blockquote:not(.alert) { margin: 1.2em 0; padding: 0 0 0 5mm; border-left: 0; font: 600 13pt/1.6 var(--md-font); color: #00566b; }
.lay-issue-brief .md-body .lec-textbox { border-top-color: #00566b; }
</style>
<header class="lay-band"><span class="series">{{series|org}}</span><span class="issue"><span data-if="number">{{number}} · </span>{{date:dot}}</span></header>
<h1 class="lay-h">{{title}}</h1>
<p class="lay-sub" data-if="subtitle">{{subtitle}}</p>
<p class="lay-by"><span data-if="author">{{author}}</span><span data-if="org">{{org}}</span></p>
<section class="lay-key" data-if="slot:핵심"><p class="lay-label">{{t:핵심 내용|Key points}}</p><div class="lay-slot">{{slot:핵심}}</div></section>
<main class="md-body">{{body}}</main>
